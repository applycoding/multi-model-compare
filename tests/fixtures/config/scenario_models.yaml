providers:
  anthropic:
    env_var: ANTHROPIC_API_KEY
  openai:
    env_var: OPENAI_API_KEY
  google:
    env_var: GEMINI_API_KEY
  xai:
    env_var: XAI_API_KEY
    reasoning_tokens_additive: false
  mock:
    env_var: null

defaults:
  max_output_tokens: 1024
  temperature: 0.2
  timeout_s: 60

limits:
  max_prompt_chars: 32000
  max_prompt_bytes: 131072
  max_body_bytes: 262144
  max_output_tokens: 32768
  timeout_s_min: 0.1
  timeout_s_max: 300
  run_deadline_s: 900
  max_concurrent_runs: 2
  shutdown_grace_s: 30

judge:
  allow_self_judging: false
  include_incomplete: false
  max_retries: 2
  timeout_s: 120
  temperature: 0.0
  output_tokens_base: 512
  output_tokens_per_cell: 200
  output_tokens_cap: 16384
  rationale_max_chars: 600
  redact_terms:
    - Claude
    - Anthropic
    - GPT
    - ChatGPT
    - OpenAI
    - Gemini
    - Google
    - Grok
    - xAI

models:
  - key: mock:mock-claude
    provider: mock
    vendor: anthropic
    model_id: mock-claude
    display_name: Mock Claude
    supports_temperature: true
    mock:
      behavior: ok
      output_words: 60
  - key: mock:mock-gpt
    provider: mock
    vendor: openai
    model_id: mock-gpt
    display_name: Mock GPT
    supports_temperature: true
    mock:
      behavior: ok
      output_words: 60
  - key: mock:mock-gemini
    provider: mock
    vendor: google
    model_id: mock-gemini
    display_name: Mock Gemini
    supports_temperature: true
    mock:
      behavior: ok
      output_words: 60
  - key: mock:mock-grok
    provider: mock
    vendor: xai
    model_id: mock-grok
    display_name: Mock Grok
    supports_temperature: true
    mock:
      behavior: ok
      output_words: 60
  - key: mock:mock-unpriced
    provider: mock
    vendor: openai
    model_id: mock-unpriced
    display_name: Mock Unpriced
    supports_temperature: true
    mock:
      behavior: ok
      output_words: 60
  - key: mock:mock-judge
    provider: mock
    vendor: google
    model_id: mock-judge
    display_name: Mock Judge
    supports_temperature: true
    mock:
      behavior: judge
      fixed_usage: [1000, 200]

profiles:
  mock:
    contestants:
      - mock:mock-claude
      - mock:mock-gpt
      - mock:mock-gemini
      - mock:mock-grok
    judge: mock:mock-judge
