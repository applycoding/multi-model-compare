{% extends "base.html" %}
{% block content %}
<h2>Run {{ record.id }}</h2>
<p>Profile: {{ record.profile }} | Seed: {{ record.seed }}</p>
<pre class="prompt">{{ record.prompt }}</pre>
{% include "_answers_table.html" %}
<form method="post" action="/runs/{{ record.id }}/delete">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <button type="submit">Delete run</button>
</form>
<p><a href="/runs/{{ record.id }}/export.json">Export JSON</a> | <a href="/runs/{{ record.id }}/export.csv">Export CSV</a></p>
{% endblock %}
