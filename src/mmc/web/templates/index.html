{% extends "base.html" %}
{% block content %}
<p class="profile">Profile: <strong>{{ profile }}</strong> (set via MMC_PROFILE)</p>
<form id="compare-form" method="post" action="/runs">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label class="field-prompt" for="prompt-input">Prompt</label>
  <textarea id="prompt-input" class="prompt-input" name="prompt" rows="8" required placeholder="Enter a prompt to compare across models…"></textarea>
  <fieldset class="field-group model-grid">
    <legend>Models</legend>
    <div class="model-grid-inner">
    {% for item in models %}
    <label class="model-option">
      <input type="checkbox" name="models" value="{{ item.spec.key }}"
        {% if item.spec.key in default_contestants %}checked{% endif %}
        {% if not item.available %}disabled{% endif %}
        data-vendor="{{ item.spec.vendor }}">
      <span class="model-name">{{ item.spec.display_name }}</span>
      {% if not item.available %}<span class="badge needs-key">{{ item.skip_reason }}</span>{% endif %}
    </label>
    {% endfor %}
    </div>
  </fieldset>
  <label class="judge-field">Judge
    <select name="judge" id="judge-select" class="judge-select">
      <option value="none">none</option>
      {% for item in models %}
      <option value="{{ item.spec.key }}" {% if item.spec.key == default_judge %}selected{% endif %}>{{ item.spec.display_name }}</option>
      {% endfor %}
    </select>
  </label>
  <p id="vendor-disclosure" data-mock="{% if profile == 'mock' %}true{% else %}false{% endif %}">
    {% if profile == 'mock' %}
    Mock mode: nothing is sent to any provider
    {% else %}
    Will be sent to: <span id="vendor-list"></span>
    {% endif %}
  </p>
  <div class="params-grid">
    <label>Temperature <input name="temperature" type="number" step="0.1" min="0" max="2"></label>
    <label>Max tokens <input name="max_output_tokens" type="number" min="1"></label>
    <label>Timeout (s) <input name="timeout_s" type="number" step="0.1"></label>
    <label>Seed <input name="seed" type="number"></label>
    <label class="checkbox-row"><input type="checkbox" name="allow_self_judging" value="true"> Allow self-judging</label>
  </div>
  <button type="submit" id="submit-btn" class="primary-btn">Run comparison</button>
</form>
{% endblock %}
